name: Keep backend awake

# Render's free plan stops the API after 15 idle minutes, and the next visitor waits
# ~30-60 s for it to boot (slow first sign-in). Pinging /health every 10 minutes keeps it up.
# One always-on free service uses ~744 of Render's 750 free instance hours a month.
# GitHub may delay scheduled runs by a few minutes and pauses them after 60 days without
# repository activity; re-enable from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 https://ucs503p-202627-creator-os.onrender.com/health
