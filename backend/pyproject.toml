[project]
name = "backend"
version = "0.1.0"
description = "Creator OS API: FastAPI backend for brand-creator deal management"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.18.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "python-multipart>=0.0.32",
    "resend>=2.36.0",
    "supabase>=2.31.0",
    "uvicorn>=0.52.3",
]

[dependency-groups]
# Installed by `uv sync` (and CI's `uv sync --frozen`) by default.
dev = [
    "import-linter>=2.13",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Explicit rule set so results don't change with ruff's built-in defaults.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "BLE", "DTZ", "RUF", "TRY", "S110"]
ignore = [
    "B008",   # FastAPI dependency injection: `Depends(...)` in argument defaults is the framework idiom
    "E501",   # line length is the formatter's job; long string literals are left as they are
    "TRY003", # long messages on raise are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S110", "BLE001"]

[tool.ruff.format]
quote-style = "double"
